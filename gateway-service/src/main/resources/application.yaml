spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hotel-service
              uri: lb://hotel-service
              predicates: [ "Path=/api/hotels/**" ]
            - id: booking-service
              uri: lb://booking-service
              predicates: [ "Path=/api/bookings/**" ]
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 8080